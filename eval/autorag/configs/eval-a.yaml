vectordb:
  - name: stock_qwen
    db_type: chroma
    client_type: persistent
    embedding_model: qwen
    collection_name: stock_v1
    path: ${PROJECT_DIR}/resources/chroma
    embedding_batch: 8

node_lines:
  - node_line_name: retrieve_node_line
    nodes:
      - node_type: lexical_retrieval
        top_k: [3, 5]
        strategy:
          metrics: [retrieval_recall, retrieval_f1, retrieval_ndcg]
        modules:
          - module_type: bm25
            bm25_tokenizer: Qwen/Qwen2.5-0.5B-Instruct

      - node_type: semantic_retrieval
        top_k: [3, 5]
        strategy:
          metrics: [retrieval_recall, retrieval_f1, retrieval_ndcg]
        modules:
          - module_type: vectordb
            vectordb: stock_qwen

      - node_type: hybrid_retrieval
        top_k: 5
        strategy:
          metrics: [retrieval_recall, retrieval_f1, retrieval_ndcg]
        modules:
          - module_type: hybrid_rrf
            weight_range: (30, 50)
